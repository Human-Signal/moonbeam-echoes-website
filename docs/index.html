<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonbeam Echoes</title>
  <meta name="description" content="Moonbeam Echoes — collect the seven colored moonbeams to unlock what the Ancients sealed away. A game by Human Signal Games." />

  <!-- Open Graph / social -->
  <meta property="og:title" content="Moonbeam Echoes" />
  <meta property="og:description" content="Collect the seven colored moonbeams to unlock what the Ancients sealed away." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://moonbeamechoes.com" />

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #05060f;
      --ink-2: #0b0e1f;
      --text: #e8ecff;
      --muted: #9aa3c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Witness Academy backdrop */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
    }
    .backdrop img {
      width: 100%;
      height: auto;
      display: block;
      flex-shrink: 0;
    }
    .backdrop-fade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(5, 6, 15, .55) 0%,
          rgba(11, 14, 31, .45) 35%,
          rgba(5, 6, 15, .7) 70%,
          var(--ink) 100%
        ),
        radial-gradient(
          ellipse 90% 70% at 50% 40%,
          rgba(5, 6, 15, .25) 0%,
          rgba(5, 6, 15, .75) 100%
        );
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem 3rem;
    }

    h1 {
      margin: 0 0 1rem;
      line-height: 0;
    }
    h1 img {
      /* Matches the old moon emblem (~180px) plus title block */
      width: min(20rem, 82vw);
      height: auto;
      display: block;
      /* Knock out the logo's solid black so the academy backdrop shows through */
      mix-blend-mode: screen;
    }

    .tagline {
      max-width: 40ch;
      color: var(--muted);
      font-size: clamp(1rem, 2.6vw, 1.2rem);
      line-height: 1.6;
      margin-bottom: 2.6rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: .85rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      padding: .95rem 2rem;
      font-size: 1.05rem;
      font-weight: 500;
      color: #0a0c1a;
      background: linear-gradient(135deg, #ffffff, #cdd6ff);
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(120, 140, 255, .35);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(150, 170, 255, .55);
    }
    .cta svg { width: 20px; height: 20px; }

    .cta-secondary {
      color: var(--text);
      background: transparent;
      border: 1px solid rgba(232, 236, 255, .35);
      box-shadow: none;
    }
    .cta-secondary:hover {
      border-color: rgba(232, 236, 255, .7);
      box-shadow: 0 10px 30px rgba(120, 140, 255, .2);
    }

    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      margin-top: 1.75rem;
    }
    .socials a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: color .18s ease, transform .18s ease;
    }
    .socials a:hover {
      color: var(--text);
      transform: translateY(-1px);
    }
    .socials svg { width: 22px; height: 22px; }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.6rem;
      color: var(--muted);
      font-size: .85rem;
    }
    footer a { color: var(--text); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.25); }
    footer a:hover { border-color: var(--text); }

  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <img src="witness-academy.png" alt="" width="1536" height="1024" />
    <div class="backdrop-fade"></div>
  </div>

  <main>
    <h1>
      <img src="logo.png" width="1080" height="1080" alt="Moonbeam Echoes" />
    </h1>
    <p class="tagline">
      Collect the seven colored moonbeams and choose what to do with what
      the Ancients sealed away.
    </p>

    <div class="actions">
      <a class="cta" href="https://humansignalgames.itch.io/moonbeam-echoes" target="_blank" rel="noopener">

        Download the Demo

        Leave Feedback

      </a>
    </nav>
  </main>

  <footer>
    A game by <a href="https://humansignalgames.itch.io" target="_blank" rel="noopener">Human Signal Games</a>

</body>
</html>
